<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gritsa Project Estimator</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- jsPDF for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box;}
        body {font-family: 'Nunito', sans-serif; font-weight: 400; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px;}
        .container {max-width: 1000px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); overflow: hidden;}
        .header {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; text-align: center;}
        .header img {max-height: 60px; margin-bottom: 15px; background: white; padding: 10px 20px; border-radius: 8px;}
        .header h1 {font-size: 2em; margin-bottom: 10px; font-weight: 700;}
        .header p {opacity: 0.9; font-size: 1.1em; font-weight: 300;}
        .wizard-container {padding: 40px;}
        .progress-bar {display: flex; justify-content: space-between; margin-bottom: 40px; position: relative;}
        .progress-bar::before {content: ''; position: absolute; top: 20px; left: 0; right: 0; height: 2px; background: #e0e0e0; z-index: 0;}
        .progress-fill {position: absolute; top: 20px; left: 0; height: 2px; background: linear-gradient(90deg, #667eea 0%, #764ba2 100%); z-index: 1; transition: width 0.3s ease;}
        .step {display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; flex: 1;}
        .step-circle {width: 40px; height: 40px; border-radius: 50%; background: white; border: 3px solid #e0e0e0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #999; transition: all 0.3s ease;}
        .step.active .step-circle {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color: #667eea; color: white; transform: scale(1.1);}
        .step.completed .step-circle {background: #4caf50; border-color: #4caf50; color: white;}
        .step-label {margin-top: 10px; font-size: 0.85em; color: #666; text-align: center;}
        .step.active .step-label {color: #667eea; font-weight: bold;}
        .form-section {animation: fadeIn 0.5s ease;}
        @keyframes fadeIn {from {opacity: 0; transform: translateY(20px);} to {opacity: 1; transform: translateY(0);}}
        .form-group {margin-bottom: 25px;}
        .form-group label {display: block; margin-bottom: 8px; font-weight: 600; color: #333;}
        .form-group input, .form-group select, .form-group textarea {width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; font-size: 1em; transition: border-color 0.3s ease;}
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {outline: none; border-color: #667eea;}
        .checkbox-group {display: flex; flex-wrap: wrap; gap: 15px;}
        .checkbox-item {flex: 1 1 calc(50% - 15px); min-width: 200px;}
        .checkbox-item label {display: flex; align-items: center; cursor: pointer; padding: 12px; border: 2px solid #e0e0e0; border-radius: 6px; transition: all 0.3s ease;}
        .checkbox-item input {margin-right: 10px; width: auto;}
        .checkbox-item label:hover {border-color: #667eea; background: #f8f9ff;}
        .checkbox-item input:checked + span {font-weight: bold; color: #667eea;}
        .integration-item {background: #f8f9ff; padding: 15px; border-radius: 6px; margin-bottom: 15px; border: 2px solid #e0e0e0;}
        .integration-header {display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}
        .integration-fields {display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-top: 10px;}
        .btn {padding: 12px 30px; border: none; border-radius: 6px; font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.3s ease;}
        .btn-primary {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;}
        .btn-primary:hover {transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);}
        .btn-secondary {background: white; color: #667eea; border: 2px solid #667eea;}
        .btn-secondary:hover {background: #f8f9ff;}
        .btn-success {background: #4caf50; color: white;}
        .btn-success:hover {background: #45a049; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);}
        .btn:disabled {opacity: 0.5; cursor: not-allowed;}
        .button-group {display: flex; justify-content: space-between; margin-top: 30px; gap: 15px;}
        .results-container {animation: fadeIn 0.5s ease;}
        .summary-card {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 8px; margin-bottom: 30px;}
        .summary-grid {display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;}
        .summary-item {text-align: center;}
        .summary-item h3 {font-size: 2em; margin-bottom: 5px; font-weight: 800;}
        .summary-item p {opacity: 0.9; font-weight: 300;}
        table {width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white;}
        th, td {padding: 15px; text-align: left; border-bottom: 1px solid #e0e0e0;}
        th {background: #f8f9ff; color: #667eea; font-weight: 700;}
        tr:hover {background: #f8f9ff;}
        .total-row {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; font-weight: bold;}
        .total-row:hover {background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);}
        .alert {padding: 15px; border-radius: 6px; margin-bottom: 20px;}
        .alert-info {background: #e3f2fd; border-left: 4px solid #2196f3; color: #1976d2;}
        .alert-warning {background: #fff3e0; border-left: 4px solid #ff9800; color: #f57c00;}
        .small-text {font-size: 0.85em; color: #666; margin-top: 5px; font-weight: 300;}
        .add-button {background: #4caf50; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.9em;}
        .add-button:hover {background: #45a049;}
        .remove-button {background: #f44336; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em;}
        .remove-button:hover {background: #da190b;}
        @media print {body {background: white; padding: 0;} .container {box-shadow: none;} .wizard-container {padding: 20px;} .button-group {display: none;}}
        @media (max-width: 768px) {.wizard-container {padding: 20px;} .checkbox-item {flex: 1 1 100%;} .integration-fields {grid-template-columns: 1fr;} .summary-grid {grid-template-columns: 1fr;} .button-group {flex-direction: column;} .btn {width: 100%;}}
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
const {useState,useEffect}=React;const RESOURCE_RATES={architect:{dedicated:70,onDemand:70,name:'Technical Architect'},pm:{dedicated:35,onDemand:35,name:'Project Manager'},seniorFullStack:{dedicated:22,onDemand:30,name:'Senior Full Stack Engineer'},fullStack:{dedicated:15,onDemand:22,name:'Full Stack Engineer'},automation:{dedicated:35,onDemand:35,name:'Automation Engineer'},devops:{dedicated:30,onDemand:30,name:'DevOps Engineer'},data:{dedicated:30,onDemand:30,name:'Data Engineer'}};const PROJECT_TYPES=['Mobile App (React Native)','Mobile App (Ionic)','Web Application','Desktop App (Electron)','Backend API','Database Modeling & Engineering','Data Pipeline Engineering','Cloud Infrastructure'];function ProjectEstimator(){const [currentStep,setCurrentStep]=useState(0);const [formData,setFormData]=useState({projectName:'',projectTypes:[],complexity:'medium',duration:3,teamSize:{architect:{hours:0,type:'onDemand'},pm:{hours:0,type:'onDemand'},seniorFullStack:{hours:0,type:'dedicated'},fullStack:{hours:0,type:'dedicated'},automation:{hours:0,type:'onDemand'},devops:{hours:0,type:'onDemand'},data:{hours:0,type:'onDemand'}},includeIaC:false,includeUnitTesting:false,includeProductionDeployment:true,integrations:[]});const [estimate,setEstimate]=useState(null);const steps=['Project Info','Team Resources','Additional Options','Integrations','Results'];const handleInputChange=(field,value)=>{setFormData(prev=>({...prev,[field]:value}))};const handleTeamSizeChange=(role,field,value)=>{setFormData(prev=>({...prev,teamSize:{...prev.teamSize,[role]:{...prev.teamSize[role],[field]:field==='hours'?parseInt(value)||0:value}}}))};const handleProjectTypeToggle=type=>{setFormData(prev=>({...prev,projectTypes:prev.projectTypes.includes(type)?prev.projectTypes.filter(t=>t!==type):[...prev.projectTypes,type]}))};const addIntegration=()=>{setFormData(prev=>({...prev,integrations:[...prev.integrations,{name:'',documentation:'good',hours:40}]}))};const updateIntegration=(index,field,value)=>{setFormData(prev=>({...prev,integrations:prev.integrations.map((int,i)=>i===index?{...int,[field]:value}:int)}))};const removeIntegration=index=>{setFormData(prev=>({...prev,integrations:prev.integrations.filter((_,i)=>i!==index)}))};const calculateEstimate=()=>{let breakdown=[];let totalHours=0;let totalCost=0;Object.keys(formData.teamSize).forEach(role=>{const {hours,type}=formData.teamSize[role];if(hours>0){const rate=RESOURCE_RATES[role][type];let effectiveHours=hours;if(formData.includeUnitTesting&&['seniorFullStack','fullStack'].includes(role)){effectiveHours=hours*1.3}const cost=effectiveHours*rate;totalHours+=effectiveHours;totalCost+=cost;breakdown.push({category:RESOURCE_RATES[role].name,type:type==='dedicated'?'Dedicated':'On-Demand',hours:effectiveHours.toFixed(1),rate:rate,cost:cost})}});if(formData.includeIaC){const iacHours=totalHours*0.15;const iacCost=iacHours*RESOURCE_RATES.devops.onDemand;totalHours+=iacHours;totalCost+=iacCost;breakdown.push({category:'Infrastructure as Code',type:'On-Demand',hours:iacHours.toFixed(1),rate:RESOURCE_RATES.devops.onDemand,cost:iacCost})}if(formData.includeProductionDeployment){const deploymentHours=totalHours*0.01;const avgRate=totalCost/totalHours;const deploymentCost=deploymentHours*avgRate;totalHours+=deploymentHours;totalCost+=deploymentCost;breakdown.push({category:'Production Deployment',type:'Mixed',hours:deploymentHours.toFixed(1),rate:avgRate.toFixed(2),cost:deploymentCost})}formData.integrations.forEach((integration,index)=>{let integrationHours=parseInt(integration.hours)||0;if(integration.documentation==='poor'){integrationHours*=1.5}else if(integration.documentation==='excellent'){integrationHours*=0.8}const integrationCost=integrationHours*RESOURCE_RATES.seniorFullStack.onDemand;totalHours+=integrationHours;totalCost+=integrationCost;breakdown.push({category:`Integration: ${integration.name}`,type:'On-Demand',hours:integrationHours.toFixed(1),rate:RESOURCE_RATES.seniorFullStack.onDemand,cost:integrationCost})});setEstimate({breakdown,totalHours:totalHours.toFixed(1),totalCost:totalCost.toFixed(2),durationMonths:formData.duration})};const nextStep=()=>{if(currentStep<steps.length-1){if(currentStep===steps.length-2){calculateEstimate()}setCurrentStep(currentStep+1)}};const prevStep=()=>{if(currentStep>0){setCurrentStep(currentStep-1)}};const canProceed=()=>{switch(currentStep){case 0:return formData.projectName&&formData.projectTypes.length>0;case 1:return Object.values(formData.teamSize).some(t=>t.hours>0);default:return true}};const exportToPDF=()=>{window.print()};const progressPercentage=(currentStep/(steps.length-1))*100;return <div className="container"><div className="header"><img src="https://static.wixstatic.com/media/1854f5_5e11f38fa2754b498cab21650a40fdb1~mv2.png/v1/fill/w_182,h_112,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/1854f5_5e11f38fa2754b498cab21650a40fdb1~mv2.png" alt="Gritsa Logo"/><h1>Project Estimator</h1><p>Get accurate estimates for your software development project</p></div><div className="wizard-container">{currentStep<steps.length-1&&<div className="progress-bar"><div className="progress-fill" style={{width:`${progressPercentage}%`}}></div>{steps.slice(0,-1).map((step,index)=><div key={index} className={`step ${index===currentStep?'active':''} ${index<currentStep?'completed':''}`}><div className="step-circle">{index<currentStep?'✓':index+1}</div><div className="step-label">{step}</div></div>)}</div>}{currentStep===0&&<div className="form-section"><h2>Project Information</h2><div className="form-group"><label>Project Name *</label><input type="text" value={formData.projectName} onChange={e=>handleInputChange('projectName',e.target.value)} placeholder="Enter your project name"/></div><div className="form-group"><label>Project Types * (Select all that apply)</label><div className="checkbox-group">{PROJECT_TYPES.map(type=><div key={type} className="checkbox-item"><label><input type="checkbox" checked={formData.projectTypes.includes(type)} onChange={()=>handleProjectTypeToggle(type)}/><span>{type}</span></label></div>)}</div></div><div className="form-group"><label>Estimated Duration (Months)</label><input type="number" min="1" max="24" value={formData.duration} onChange={e=>handleInputChange('duration',parseInt(e.target.value))}/></div><div className="form-group"><label>Project Complexity</label><select value={formData.complexity} onChange={e=>handleInputChange('complexity',e.target.value)}><option value="low">Low - Simple features, basic functionality</option><option value="medium">Medium - Moderate complexity with multiple features</option><option value="high">High - Complex business logic, advanced features</option><option value="enterprise">Enterprise - Mission-critical, highly scalable</option></select></div></div>}{currentStep===1&&<div className="form-section"><h2>Team Resources</h2><p className="small-text" style={{marginBottom:'20px'}}>Specify the estimated hours for each role and whether they'll be dedicated or on-demand resources.</p>{Object.keys(RESOURCE_RATES).map(role=><div key={role} className="form-group"><label>{RESOURCE_RATES[role].name}</label><div style={{display:'grid',gridTemplateColumns:'2fr 1fr 1fr',gap:'10px'}}><div><input type="number" min="0" placeholder="Hours" value={formData.teamSize[role].hours||''} onChange={e=>handleTeamSizeChange(role,'hours',e.target.value)}/><div className="small-text">Estimated hours needed</div></div><div><select value={formData.teamSize[role].type} onChange={e=>handleTeamSizeChange(role,'type',e.target.value)} disabled={formData.teamSize[role].hours===0}><option value="dedicated">Dedicated</option><option value="onDemand">On-Demand</option></select><div className="small-text">Resource type</div></div><div><input type="text" value={`$${RESOURCE_RATES[role][formData.teamSize[role].type]}/hr`} disabled style={{background:'#f0f0f0'}}/><div className="small-text">Hourly rate</div></div></div></div>)}<div className="alert alert-info"><strong>Resource Guidance:</strong><ul style={{marginLeft:'20px',marginTop:'10px'}}><li>Technical Architect: Initial planning & periodic reviews (10-20% of project)</li><li>Project Manager: Ongoing coordination (available on-demand)</li><li>Senior Engineers: Complex features & team leadership</li><li>Engineers: Feature development & implementation</li><li>Specialists: On-demand for specific needs (automation, DevOps, data)</li></ul></div></div>}{currentStep===2&&<div className="form-section"><h2>Additional Options</h2><div className="form-group"><label style={{display:'flex',alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked={formData.includeIaC} onChange={e=>handleInputChange('includeIaC',e.target.checked)} style={{marginRight:'10px',width:'auto'}}/><span>Include Infrastructure as Code (IaC)</span></label><div className="small-text" style={{marginLeft:'30px'}}>Adds ~15% to total development time. Uses DevOps engineer to create automated infrastructure deployment scripts.</div></div><div className="form-group"><label style={{display:'flex',alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked={formData.includeUnitTesting} onChange={e=>handleInputChange('includeUnitTesting',e.target.checked)} style={{marginRight:'10px',width:'auto'}}/><span>Include Unit Testing / Test-Driven Development</span></label><div className="small-text" style={{marginLeft:'30px'}}>Increases development time by 30% but significantly improves code quality and reduces bugs.</div></div><div className="form-group"><label style={{display:'flex',alignItems:'center',cursor:'pointer'}}><input type="checkbox" checked={formData.includeProductionDeployment} onChange={e=>handleInputChange('includeProductionDeployment',e.target.checked)} style={{marginRight:'10px',width:'auto'}}/><span>Include Production Deployment</span></label><div className="small-text" style={{marginLeft:'30px'}}>Final production deployment process takes approximately 1% of total engineering time.</div></div><div className="alert alert-warning"><strong>Recommendation:</strong> We strongly recommend including Unit Testing for production applications. While it increases initial development time, it saves significant time and cost in bug fixes and maintenance.</div></div>}{currentStep===3&&<div className="form-section"><h2>Third-Party Integrations</h2><p className="small-text" style={{marginBottom:'20px'}}>Add any third-party services or APIs you plan to integrate. The quality of their documentation affects integration time.</p>{formData.integrations.map((integration,index)=><div key={index} className="integration-item"><div className="integration-header"><strong>Integration #{index+1}</strong><button className="remove-button" onClick={()=>removeIntegration(index)}>Remove</button></div><div className="integration-fields"><div><label style={{fontSize:'0.85em',marginBottom:'5px'}}>Integration Name</label><input type="text" placeholder="e.g., Stripe Payment, Google Maps" value={integration.name} onChange={e=>updateIntegration(index,'name',e.target.value)}/></div><div><label style={{fontSize:'0.85em',marginBottom:'5px'}}>Documentation Quality</label><select value={integration.documentation} onChange={e=>updateIntegration(index,'documentation',e.target.value)}><option value="excellent">Excellent</option><option value="good">Good</option><option value="poor">Poor/Undocumented</option></select></div><div><label style={{fontSize:'0.85em',marginBottom:'5px'}}>Base Hours</label><input type="number" min="1" value={integration.hours} onChange={e=>updateIntegration(index,'hours',e.target.value)}/></div></div><div className="small-text" style={{marginTop:'8px'}}>{integration.documentation==='excellent'&&'× 0.8 hours (well-documented saves time)'}{integration.documentation==='good'&&'× 1.0 hours (standard integration time)'}{integration.documentation==='poor'&&'× 1.5 hours (poor docs increase time by 50%)'}</div></div>)}<button className="add-button" onClick={addIntegration}>+ Add Integration</button><div className="alert alert-info" style={{marginTop:'20px'}}><strong>Integration Guidance:</strong><ul style={{marginLeft:'20px',marginTop:'10px'}}><li>Simple API integrations: 20-40 hours</li><li>Payment gateways: 40-80 hours</li><li>Complex enterprise systems: 80-160 hours</li><li>Custom/legacy systems: 120-240+ hours</li></ul></div></div>}{currentStep===4&&estimate&&<div className="form-section results-container" id="estimation-results"><h2>Project Estimation Results</h2><div className="summary-card"><h3>{formData.projectName}</h3><div className="summary-grid"><div className="summary-item"><h3>{estimate.totalHours}</h3><p>Total Hours</p></div><div className="summary-item"><h3>${estimate.totalCost}</h3><p>Total Cost</p></div><div className="summary-item"><h3>{formData.duration}</h3><p>Months Duration</p></div></div></div><h3>Project Details</h3><table><tbody><tr><td><strong>Project Types:</strong></td><td>{formData.projectTypes.join(', ')}</td></tr><tr><td><strong>Complexity:</strong></td><td style={{textTransform:'capitalize'}}>{formData.complexity}</td></tr><tr><td><strong>Infrastructure as Code:</strong></td><td>{formData.includeIaC?'Yes':'No'}</td></tr><tr><td><strong>Unit Testing/TDD:</strong></td><td>{formData.includeUnitTesting?'Yes (+30% dev time)':'No'}</td></tr><tr><td><strong>Production Deployment:</strong></td><td>{formData.includeProductionDeployment?'Yes (+1% time)':'No'}</td></tr></tbody></table><h3>Cost Breakdown</h3><table><thead><tr><th>Category</th><th>Type</th><th>Hours</th><th>Rate</th><th>Cost</th></tr></thead><tbody>{estimate.breakdown.map((item,index)=><tr key={index}><td>{item.category}</td><td>{item.type}</td><td>{item.hours}</td><td>${item.rate}/hr</td><td>${item.cost.toFixed(2)}</td></tr>)}<tr className="total-row"><td colSpan="2"><strong>TOTAL</strong></td><td><strong>{estimate.totalHours} hrs</strong></td><td></td><td><strong>${estimate.totalCost}</strong></td></tr></tbody></table><div className="alert alert-info"><strong>Important Notes:</strong><ul style={{marginLeft:'20px',marginTop:'10px'}}><li>This estimate is based on the information provided and actual costs may vary</li><li>Dedicated resources offer better cost efficiency for longer engagements</li><li>On-demand resources provide flexibility for variable workloads</li><li>Unit testing increases initial cost but significantly reduces long-term maintenance</li><li>All rates are in USD per hour</li></ul></div><div className="alert alert-warning"><strong>Next Steps:</strong> Ready to get started? Contact us at info@gritsa.com or call +44 (743) 685-5207 to discuss your project in detail.</div><div className="button-group"><button className="btn btn-secondary" onClick={()=>setCurrentStep(0)}>Start New Estimate</button><button className="btn btn-success" onClick={exportToPDF}>Print / Export to PDF</button></div></div>}{currentStep<steps.length-1&&<div className="button-group">{currentStep>0&&<button className="btn btn-secondary" onClick={prevStep}>← Previous</button>}<button className="btn btn-primary" onClick={nextStep} disabled={!canProceed()} style={{marginLeft:'auto'}}>{currentStep===steps.length-2?'Calculate Estimate':'Next →'}</button></div>}</div></div>}ReactDOM.render(<ProjectEstimator/>,document.getElementById('root'));
    </script>
</body>
</html>
