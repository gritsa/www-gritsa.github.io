document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-items:center;gap:12px\">\n      <div style=\"width:34px;height:34px;border-radius:50%;background:oklch(0.78 0.16 62);display:flex;align-items:center;justify-content:center\"><div style=\"width:14px;height:14px;border-radius:50%;border:3px solid #1C1A24\"><\u002Fdiv><\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column\">\n        <span style=\"font-weight:800;font-size:21px;letter-spacing:-0.02em\">IndiaOptics<\u002Fspan>\n        <span style=\"font-size:12px;color:#6E6A78;font-weight:500\">One Nation One Optician · clickable prototype v0.2<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"display:flex;gap:6px;background:#EFE8DC;padding:5px;border-radius:999px\">\n      <sc-for list=\"{{ lanes }}\" as=\"l\" hint-placeholder-count=\"3\">\n        <button sc-camel-on-click=\"{{ l.onClick }}\" style=\"border:0;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:600;background:{{ l.bg }};color:{{ l.fg }}\">{{ l.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main style=\"flex:1;display:flex;gap:32px;padding:28px 32px 48px;align-items:flex-start;flex-wrap:wrap;justify-content:center\">\n    <aside style=\"width:230px;flex:none;display:flex;flex-direction:column;gap:20px\">\n      <sc-for list=\"{{ mapGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <div style=\"font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#6E6A78;padding:0 10px 6px\">{{ g.name }}<\u002Fdiv>\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"5\">\n            <button sc-camel-on-click=\"{{ it.onClick }}\" style=\"display:flex;align-items:center;gap:10px;border:0;text-align:left;padding:8px 10px;border-radius:12px;background:{{ it.bg }};color:#1C1A24;font-size:14px;font-weight:500\">\n              <span style=\"font:600 11px 'JetBrains Mono',monospace;padding:3px 6px;border- n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ setTopup }}\" style=\"flex:1;border:2px solid #1C1A24;border-radius:16px;padding:12px;text-align:left;background:{{ m2Bg }};color:#1C1A24;display:flex;flex-direction:column;gap:2px\">\n      <span style=\"font-weight:700;font-size:15px\">Top-up · 5–50<\u002Fspan><span style=\"font-size:12px;color:#4A4654\">Broaden range · 24 h confirm<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n  <button sc-camel-on-click=\"{{ doSearch }}\" style=\"border:0;border-radius:18px;background:#1C1A24;color:#fff;padding:17px;font-size:17px;font-weight:700;opacity:{{ searchOpacity }}\">Search the network →<\u002Fbutton>\n  <div style=\"display:flex;flex-direction:column;gap:8px\">\n    <span style=\"font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#6E6A78\">Searched recently<\u002Fspan>\n    <button sc-camel-on-click=\"{{ recentRay }}\" style=\"display:flex;justify-content:space-between;align-items:center;border:1px solid #E4DCCF;background:#fff;border-radius:16px;padding:14px;text-align:left\">\n      <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:15px;color:#1C1A24\">RayBan 3025 gold 58<\u002Fspan><span style=\"font-size:12px;color:oklch(0.45 0.12 160);font-weight:600\">3 held nearby<\u002Fspan><\u002Fspan><span style=\"font-size:18px;color:#1C1A24\">→<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ recentOak }}\" style=\"display:flex;justify-content:space-between;align-items:center;border:1px solid #E4DCCF;background:#fff;border-radius:16px;padding:14px;text-align:left\">\n      <span style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:600;font-size:15px;color:#1C1A24\">Oakley OO9208 52<\u002Fspan><span style=\"font-size:12px;color:#6E6A78;font-weight:600\">0 available<\u002Fspan><\u002Fspan><span style=\"font-size:18px;color:#1C1A24\">→<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fdiv>\n<\u g:12px 18px;font-weight:700;font-size:15px\">Notify me when listed<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= B3 ================= -->\n<sc-if value=\"{{ is.b3 }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:6px 20px 24px;display:flex;flex-direction:column;gap:16px;align-items:stretch\">\n  <div style=\"display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px\">\n    <span style=\"font-size:15px;font-weight:600;color:#6E6A78\">Held for you<\u002Fspan>\n    <div style=\"position:relative;width:220px;height:220px\">\n      <svg width=\"220\" height=\"220\" sc-camel-view-box=\"0 0 220 220\" style=\"position:absolute;inset:0\">\n        <circle cx=\"110\" cy=\"110\" r=\"96\" style=\"fill:none;stroke:#EDE4D5;stroke-width:16\"><\u002Fcircle>\n        <circle cx=\"110\" cy=\"110\" r=\"96\" style=\"fill:none;stroke:oklch(0.78 0.16 62);stroke-width:16;stroke-linecap:round;stroke-dasharray:603.2;stroke-dashoffset:{{ holdOffset }};transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dashoffset 1s linear\"><\u002Fcircle>\n      <\u002Fsvg>\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px\">\n        <span style=\"font:600 48px 'JetBrains Mono',monospace;letter-spacing:-0.04em\">{{ holdTxt }}<\u002Fspan>\n        <span style=\"font-size:12px;color:#6E6A78;text-align:center;max-width:130px;line-height:1.3\">until seller confirms · auto-cancels after<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border-radius:20px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border:1px solid #E4DCCF\">\n    <div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-weight:700;font-size:16px\">{{ sku.title }}<\u002Fspan><span style=\"font:500 12px 'JetBrains Mono',monospace;color:#6E6A78\">{{ sku.code }} e AWB button unlocks only when all are done.'],\n    s6: ['S6', \"Who can't see my stock\", 'Launch requirement. Excluded buyers are filtered before ranking, enforced in the database.', 'Drag the radius, add or remove pincodes and shops.'],\n    s7: ['S7', 'Replenishment nudge · Ph 3', 'The retention hook: a tool that earns them money upstream, not a dead-stock dump.', 'Apply the 8% push and watch the slab bar move.'],\n    more: ['—', 'More', 'Account, rules, retention tools and messaging preferences.', 'Jump to exclusion rules or the WhatsApp cadence.'],\n    o1: ['O1', 'Quarantine queue', 'Every unresolved listing waits here. Nothing is searchable by buyers until ops resolves it.', 'Click a row or \"Resolve next\".'],\n    o2: ['O2', 'Resolve to canonical SKU', 'Ops decides once; the spine stays canonical. Depth over breadth — 5–8 brands done properly.', 'Pick a candidate and publish — the queue count drops.'],\n    o3: ['O3', 'Retailer onboarding', 'Onboarding flags composition-scheme dealers — the structural blocker under an agency/TCS model.', 'Choose a brand tier and approve or hold.'],\n    o4: ['O4', 'Dispute · photo vs photo', 'Evidence-first: two photos, two statements, one immutable event log.', 'Pick a resolution.'],\n    w1: ['W1', 'Capture by photo', 'Numeric replies only. Whole catalogue entry becomes taking photographs.', 'Reply 1, 2 or 3 — then send another photo.'],\n    w2: ['W2', 'Targeted reconfirm', 'Only aging, high-demand or recently viewed listings get asked about. Broadcast daily messaging gets the number banned.', 'Reply with a sold number, or change the cadence.'],\n    w3: ['W3', 'Order events + fallback', 'Order-critical messages fall back to SMS/IVR behind one MessageTransport interface.', 'Simulate a WhatsApp outage, then reply Y or N.']\n  };\n  init() {\n    return {\n      lane: 'app', screen: 'b1', q: 'prada black 52 new model', mode: 'urgent', skuKey: 'prada', sel: 0, heldIdx: 0, rerouted: false, b4reason: 'declined',\n      hold: 900, confirm: 1450, orderWaiting: true, b5Status: 'confirmed', b6shot: false, b6result: null, ordTab: 'buy', buyState: 'none',\n      listed: 312, scanning: false, qty: 1, price: '8,400', cond: 'New', invoice: false,\n      box: false, ins: true, dphoto: false, slot: 0, s5done: false,\n      radius: 25, pins: ['110005', '110060'], pinInput: '', shops: [{ name: 'Vision Plus', loc: 'Sector 14, Gurugram' }, { name: 'Nayan Opticals', loc: 'DLF Phase 1, Gurugram' }],\n      s7done: false, queue: 38, qTab: 0, cand: 0, tier: 2, o3: null, o4: null, disputeFromApp: false,\n      chats: this.initChats(), chips: { w1: ['1', '2', '3'], w2: ['1', '2', '3', 'None sold'], w3: ['Y', 'N'] }, cadence: 'Weekly', waDown: false, toast: null\n    };\n  }\n  initChats() {\n    return {\n      w1: [{ k: 'photo', text: 'temple-arm photo' }, { k: 'bot', text: 'Read it as:\\nPrada PR 17WS 1AB5Z1 · 52-20-140\\n\\nReply 1 to list at ₹8,400, 2 to change price, 3 if wrong.' }],\n      w2: [{ k: 'bot', text: 'Still have these? Reply with the numbers you have SOLD.\\n\\n1) Prada PR17 black 52\\n2) RayBan 3025 gold 58\\n3) Oakley OO9208 grey 52' }],\n      w3: [{ k: 'bot', edge: '4px solid oklch(0.78 0.16 62)', text: 'ORDER · 24 MIN TO CONFIRM\\nPrada PR17 black 52 · ₹8,400 · qty 1\\n\\nReply Y to confirm, N if sold.' }]\n    };\n  }\n  state = this.init();\n  scrollRef = React.createRef();\n  componentDidMount() { this.iv = setInterval(() => this.tick(), 1000); }\n  componentWillUnmount() { clearInterval(this.iv); clearTimeout(this.tt); clearTimeout(this.st); }\n  componentDidUpdate(pp, ps) { if ((ps.screen !== this.state.screen || ps.lane !== this.state.lane) && this.scrollRef.current) this.scrollRef.current.scrollTop = 0; }\n  tick() {\n    const s = this.state, u = {};\n    if (s.lane === 'app' && s.screen === 'b3') {\n      if (s.hold <= 1) { this.decline('expired'); return; }\n      u.hold = s.hold - 1;\n    }\n    if (s.orderWaiting && s.confirm > 0) u.confirm = s.confirm - 1;\n    if (Object.keys(u).length) this.setState(u);\n  }\n  toast(msg) { clearTimeout(this.tt); this.setState({ toast: msg }); this.tt = setTimeout(() => this.setState({ toast: null }), 2800); }\n  go(screen, extra) {\n    const lane = screen[0] === 'o' ? 'ops' : screen[0] === 'w' ? 'msg' : 'app';\n    this.setState(Object.assign({ screen, lane, toast: null }, extra || {}));\n  }\n  resolve(q) {\n    if (/pra|prd|17ws/i.test(q)) return 'prada';\n    if (/ray|rb|3025/i.test(q)) return 'rayban';\n    if (/oak|9208/i.test(q)) return 'oakley';\n    return null;\n  }\n  inr(n) { return '₹' + n.toLocaleString('en-IN'); }\n  mmss(t) { return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }\n  fmtSeller(x) { return x ? Object.assign({}, x, { priceTxt: this.inr(x.price) }) : {}; }\n  decline(reason) {\n    const sk = this.SKUS[this.state.skuKey];\n    if (this.state.heldIdx + 1 < sk.sellers.length) this.go('b4', { b4reason: reason });\n    else this.go('b2');\n  }\n  reply(th, v) {\n    const s = this.state, add = [{ k: 'me', text: v }];\n    let chips = [];\n    if (th === 'w1') {\n      if (v === 'Send another photo') { add[0] = { k: 'photo', text: 'temple-arm photo #2' }; add.push({ k: 'bot', text: 'Read it as:\\nRay-Ban RB3025 001 · 58-14-135\\n\\nReply 1 to list at ₹6,900, 2 to change price, 3 if wrong.' }); chips = ['1', '2', '3']; }\n      else if (v === '1') { add.push({ k: 'bot', text: 'Listed. ' + (s.listed + 1) + ' pieces live. Send the next photo whenever.' }); chips = ['Send another photo']; this.setState({ listed: s.listed + 1 }); }\n      else if (v === '2') { add.push({ k: 'bot', text: 'Send the new price in rupees.' }); chips = ['8200', '7900']; }\n      else if (v === '8200' || v === '7900') { add.push({ k: 'bot', text: 'Listed at ₹' + Number(v).toLocaleString('en-IN') + '. ' + (s.listed + 1) + ' pieces live.' }); chips = ['Send another photo']; this.setState({ listed: s.listed + 1 }); }\n      else if (v === '3') { add.push({ k: 'bot', text: 'Thanks — sent to our catalogue team. It stays out of search until resolved. A sharper shot of the arm helps.' }); chips = ['Send another photo']; this.setState({ queue: s.queue + 1 }); }\n    } else if (th === 'w2') {\n      const names = { '1': 'Prada PR17', '2': 'RayBan', '3': 'Oakley' };\n      if (v === 'None sold') add.push({ k: 'bot', text: 'All three stay live — freshness badges renewed for 7 days.' });\n      else add.push({ k: 'bot', text: 'Removed the ' + names[v] + '. The other two stay live and keep their freshness badge.' });\n    } else if (th === 'w3') {\n      const via = s.waDown ? '[SMS] ' : '';\n      if (v === 'Y') add.push({ k: 'bot', text: via + 'Confirmed. Pickup 2–5pm today. Photo on dispatch required — open the app to shoot it.' });\n      else add.push({ k: 'bot', text: via + 'Got it. Buyer rerouted to the next seller. Listing removed.' });\n    }\n    this.setState({ chats: Object.assign({}, s.chats, { [th]: s.chats[th].concat([add[0]]) }), chips: Object.assign({}, s.chips, { [th]: [] }) });\n    clearTimeout(this.st);\n    this.st = setTimeout(() => {\n      const c = this.state.chats;\n      this.setState({ chats: Object.assign({}, c, { [th]: c[th].concat(add.slice(1)) }), chips: Object.assign({}, this.state.chips, { [th]: chips }) });\n    }, 650);\n  }\n  renderVals() {\n    const s = this.state, INK = '#1C1A24', SAF = 'oklch(0.78 0.16 62)', MINT = 'oklch(0.94 0.06 165)', REDS = 'oklch(0.94 0.04 28)', LIL = 'oklch(0.92 0.05 295)';\n    const sk = this.SKUS[s.skuKey];\n    const resolvedKey = this.resolve(s.q);\n    const scr = s.screen;\n    const is = {}; ['b1','b2','b3','b4','b5','b6','bo','s1','s2','s3','s4','s5','s6','s7','more','o1','o2','o3','o4'].forEach(k => is[k] = scr === k);\n    const go = {}; ['b1','b2','b3','b4','b5','b6','bo','s1','s2','s3','s4','s5','s6','s7','more','o1','o2','o3','o4','w1','w2','w3'].forEach(k => go[k] = () => this.go(k));\n    const n = this.NOTES[scr] || this.NOTES.b1;\n    const held = this.fmtSeller(sk.sellers[s.heldIdx]);\n    const sub = this.fmtSeller(sk.sellers[s.heldIdx + 1]);\n    const laneDefs = [['app', 'Retailer app', 'b1'], ['ops', 'Ops console', 'o1'], ['msg', 'WhatsApp agent', 'w1']];\n    const groups = s.lane === 'app'\n      ? [{ name: 'Buyer lane', items: [['b1','B1','Find a piece'],['b2','B2','Masked results'],['b3','B3','Hold running'],['b4','B4','Declined → rerouted'],['b5','B5','Accepted · revealed'],['b6','B6','Receipt check'],['bo','OR','Orders']] },\n         { name: 'Seller lane', items: [['s1','S1','Seller home'],['s2','S2','Photograph arm'],['s3','S3','One-tap confirm'],['s4','S4','Incoming order'],['s5','S5','Pack & dispatch'],['s6','S6','Exclusion rules'],['s7','S7','Slab tracker']] }]\n      : s.lane === 'ops' ? [{ name: 'Ops lane', items: [['o1','O1','Quarantine queue'],['o2','O2','Resolve SKU'],['o3','O3','Onboarding'],['o4','O4','Dispute']] }]\n      : [{ name: 'Messaging lane', items: [['w1','W1','Capture by photo'],['w2','W2','Targeted reconfirm'],['w3','W3','Order events']] }];\n    const mapGroups = groups.map(g => ({ name: g.name, items: g.items.map(([k, code, title]) => {\n      const a = scr === k;\n      return { code, title, bg: a ? '#fff' : 'transparent', codeBg: a ? SAF : '#E8E0D2', codeFg: INK, onClick: () => {\n        const extra = {};\n        if (k === 'b4' && !sk.sellers[s.heldIdx + 1]) Object.assign(extra, { skuKey: 'prada', heldIdx: 0 });\n        if (k === 'b3' || k === 'b4') extra.hold = 900;\n        if (k === 's4' && !s.orderWaiting) Object.assign(extra, { orderWaiting: true, confirm: 1450 });\n        this.go(k, extra);\n      } };\n    }) }));\n    const sellers = sk.sellers.map((x, i) => ({ ...this.fmtSeller(x), top: i === 0, border: s.sel === i ? INK : '#E4DCCF', shadow: s.sel === i ? '4px 4px 0 ' + SAF : 'none', opacity: x.rel < 60 && s.sel !== i ? 0.6 : 1, relBg: x.rel >= 85 ? MINT : x.rel >= 70 ? 'oklch(0.95 0.05 70)' : REDS, relFg: INK, pick: () => this.setState({ sel: i }) }));\n    c
